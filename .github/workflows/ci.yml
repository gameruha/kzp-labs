name: Java CI

on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Grant execute permission for mvnw
      if: runner.os != 'Windows'
      run: chmod +x mvnw

    - name: Verify and Package with Maven on Unix
      if: runner.os != 'Windows'
      run: |
        ./mvnw -B clean verify
        ./mvnw -B package

    - name: Verify and Package with Maven on Windows
      if: runner.os == 'Windows'
      run: |
        .\mvnw.cmd -B clean verify
        .\mvnw.cmd -B package

    - name: Upload executable JAR
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: jar-${{ matrix.os }}-${{ github.run_number }}
        path: target/*.jar
        if-no-files-found: error